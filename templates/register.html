{% extends "base.html" %}

{% block title %}Create Account - Rent Finder Pakistan{% endblock %}

{% block content %}
<div class="container" style="padding-top: calc(var(--header-height) + 3rem); padding-bottom: 5rem; max-width: 520px;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 2.5rem; backdrop-filter: blur(24px); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-badge" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">Create Your Account</h1>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Join Pakistan's leading online rental property network</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="admin-form-group">
        <label>Account Role *</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
          <label style="border: 1px solid var(--border-glass); padding: 0.75rem; border-radius: var(--radius-md); text-align: center; cursor: pointer; background: var(--bg-surface);">
            <input type="radio" name="role" value="user" checked>
            <div style="font-weight: 700; font-size: 0.85rem; margin-top: 0.25rem;">Tenant</div>
          </label>
          <label style="border: 1px solid var(--border-glass); padding: 0.75rem; border-radius: var(--radius-md); text-align: center; cursor: pointer; background: var(--bg-surface);">
            <input type="radio" name="role" value="landlord">
            <div style="font-weight: 700; font-size: 0.85rem; margin-top: 0.25rem;">Landlord</div>
          </label>
          <label style="border: 1px solid var(--border-glass); padding: 0.75rem; border-radius: var(--radius-md); text-align: center; cursor: pointer; background: var(--bg-surface);">
            <input type="radio" name="role" value="agent">
            <div style="font-weight: 700; font-size: 0.85rem; margin-top: 0.25rem;">Agent</div>
          </label>
        </div>
      </div>

      <div class="admin-form-group">
        <label>Full Name *</label>
        <input type="text" name="name" class="admin-input" placeholder="e.g. Asad Malik" required>
      </div>

      <div class="admin-form-group">
        <label>Email Address *</label>
        <input type="email" name="email" class="admin-input" placeholder="name@example.com" required>
      </div>

      <div class="admin-form-group">
        <label>Password (Min 6 characters) *</label>
        <input type="password" name="password" class="admin-input" placeholder="Create strong password" minlength="6" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="admin-form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" class="admin-input" placeholder="+92 300 1234567">
        </div>

        <div class="admin-form-group">
          <label>WhatsApp</label>
          <input type="tel" name="whatsapp" class="admin-input" placeholder="+92 300 1234567">
        </div>
      </div>

      <div class="admin-form-group">
        <label>City</label>
        <select name="city" class="admin-select">
          <option value="Karachi">Karachi</option>
          <option value="Lahore">Lahore</option>
          <option value="Islamabad">Islamabad</option>
          <option value="Rawalpindi">Rawalpindi</option>
          <option value="Hyderabad">Hyderabad</option>
          <option value="Multan">Multan</option>
          <option value="Faisalabad">Faisalabad</option>
          <option value="Peshawar">Peshawar</option>
          <option value="Quetta">Quetta</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
        Complete Registration
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-emerald); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
